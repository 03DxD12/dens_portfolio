<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Book Appointment - Dental Clinic</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" href="Dental Smile Logo2.png" type="image/x-icon" />
    <style>
      body {
        background-color: #f8f9fa;
      }
      .form-container {
        background: #ffffff;
        padding: 30px;
        border-radius: 20px;
        box-shadow: 0 0 30px rgba(0, 0, 0, 0.1);
      }
      .form-control,
      .form-select {
        border-radius: 10px;
      }
      .btn-primary {
        border-radius: 10px;
        font-weight: bold;
      }
      footer {
        background-color: #ffffff;
      }
    </style>
  </head>
  <body>
    <main>
      <!-- Navbar -->
      <nav
        class="navbar navbar-expand-lg bg-light p-3 sticky-top border-bottom shadow"
      >
        <div class="container-fluid">
          <a class="navbar-brand" href="index.html">
            <img
              src="Dental Smile Logo2.png"
              alt="Logo"
              width="40"
              class="d-inline-block align-text-top"
            />
          </a>
          <button
            class="navbar-toggler collapsed"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarNavDropdown"
          >
            <span class="navbar-toggler-icon"></span>
          </button>
          <div
            class="collapse navbar-collapse justify-content-end my-1"
            id="navbarNavDropdown"
          >
            <ul class="navbar-nav">
              <li class="nav-item">
                <a class="nav-link" href="index.html">HOME</a>
              </li>
              <li class="nav-item">
                <a class="nav-link active" href="appointment.html"
                  >APPOINTMENT</a
                >
              </li>
              <li class="nav-item">
                <a class="nav-link" href="service.html">SERVICES</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="about.html">ABOUT</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="contact.html">CONTACT / FAQ</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="admindashboard.html"
                  >ADMIN DASHBOARD</a
                >
              </li>
            </ul>
          </div>
        </div>
      </nav>

      <!-- Appointment Section -->
      <div class="container py-5">
        <div class="row g-5 align-items-center">
          <div class="col-lg-6 d-none d-lg-block">
            <img
              src="clockt.png"
              class="img-fluid rounded-4 shadow"
              alt="Dental Appointment"
              style="border: #007bff 5px solid"
            />
          </div>
          <div class="col-lg-6">
            <div class="form-container">
              <h2 class="text-center text-primary mb-4">Book an Appointment</h2>
              <form id="bookingForm">
                <div class="mb-3">
                  <label for="patientName" class="form-label">Full Name</label>
                  <input
                    type="text"
                    class="form-control"
                    id="patientName"
                    name="patientName"
                    required
                  />
                </div>
                <div class="mb-3">
                  <label for="patientEmail" class="form-label">Email</label>
                  <input
                    type="email"
                    class="form-control"
                    id="patientEmail"
                    name="patientEmail"
                    required
                  />
                </div>
                <div class="mb-3">
                  <label for="age" class="form-label">Age</label>
                  <input
                    type="number"
                    class="form-control"
                    id="age"
                    name="age"
                    required
                  />
                </div>
                <div class="mb-3">
                  <label for="sex" class="form-label">Sex</label>
                  <select class="form-select" id="sex" name="sex" required>
                    <option value="" disabled selected>Select sex</option>
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                    <option value="Other">Other</option>
                  </select>
                </div>
                <div class="mb-3">
                  <label for="address" class="form-label">Address</label>
                  <input
                    type="text"
                    class="form-control"
                    id="address"
                    name="address"
                    required
                  />
                </div>
                <div class="mb-3">
                  <label for="medicalRecord" class="form-label"
                    >Medical Record / Allergies</label
                  >
                  <textarea
                    class="form-control"
                    id="medicalRecord"
                    name="medicalRecord"
                    rows="3"
                    placeholder="Any allergies, conditions, or medications?"
                  ></textarea>
                </div>
                <div class="mb-3">
                  <label for="appointmentType" class="form-label"
                    >Appointment Type</label
                  >
                  <select
                    class="form-select"
                    id="appointmentType"
                    name="appointmentType"
                    required
                  >
                    <option value="" disabled selected>
                      ▼ Select an appointment type
                    </option>
                    <option value="cleaning">Cleaning</option>
                    <option value="checkup">Checkup</option>
                    <option value="root_canal">Root Canal</option>
                    <option value="teeth_whitening">Teeth Whitening</option>
                    <option value="gum_treatment">Gum Treatment</option>
                    <option value="ortho_consult">
                      Orthodontic Consultation
                    </option>
                    <option value="oral_cancer_screening">
                      Oral Cancer Screening
                    </option>
                    <option value="gum_health_assessment">
                      Gum Health Assessment
                    </option>
                    <option value="tooth_extraction">Tooth Extraction</option>
                    <option value="dental_filling">Dental Filling</option>
                    <option value="crowns">Crowns</option>
                    <option value="denture">Denture</option>
                  </select>
                </div>
                <div class="mb-3">
                  <label for="appointmentDate" class="form-label">Date</label>
                  <input
                    type="date"
                    class="form-control"
                    id="appointmentDate"
                    name="appointmentDate"
                    required
                  />
                </div>
                <div class="mb-3">
                  <label for="appointmentTime" class="form-label">Time</label>
                  <input
                    type="time"
                    class="form-control"
                    id="appointmentTime"
                    name="appointmentTime"
                    required
                  />
                </div>
                <button type="submit" class="btn btn-primary w-100">
                  Book Appointment
                </button>
              </form>
              <div id="bookingMessage" class="mt-3 text-center"></div>
            </div>
          </div>
        </div>
      </div>

      <!-- Footer -->
      <footer class="d-flex flex-wrap border-top">
        <div class="container d-flex justify-content-center align-items-center">
          <a href="index.html" class="text-decoration-none">
            <img class="bi me-2" width="40" src="Dental Smile Logo2.png" />
          </a>
          <p class="fs-6 my-4 text-secondary">
            ©
            <span
              ><script>
                document.write(new Date().getFullYear());
              </script></span
            >
            Dental Clinic. All rights reserved.
          </p>
        </div>
      </footer>
    </main>

    <script src="js/scripts.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
