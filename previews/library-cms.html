<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Library CMS Demo</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, sans-serif; color: #172033; background: #f6f3ee; }
    header { padding: 22px clamp(16px, 5vw, 64px); background: #263238; color: #fff; display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
    main { padding: 32px clamp(16px, 5vw, 64px); display: grid; grid-template-columns: 360px 1fr; gap: 24px; }
    .panel, .book { background: #fff; border: 1px solid #ded7cc; border-radius: 16px; box-shadow: 0 14px 34px rgba(38,50,56,.09); }
    .panel { padding: 22px; }
    h1, h2 { margin: 0 0 12px; }
    p { color: #67717e; line-height: 1.6; }
    form, .filters { display: grid; gap: 12px; }
    input, select { width: 100%; border: 1px solid #d5dce5; border-radius: 10px; padding: 12px 13px; font: inherit; }
    button { border: 0; border-radius: 999px; padding: 12px 16px; background: #14b8a6; color: #06201d; font-weight: 800; cursor: pointer; }
    .books { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; margin-top: 16px; }
    .book { padding: 18px; display: grid; gap: 8px; }
    .tag { width: fit-content; padding: 5px 10px; border-radius: 999px; background: #e0f2fe; color: #0369a1; font-size: .8rem; font-weight: 800; }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .danger { background: #fecaca; color: #7f1d1d; }
    @media (max-width: 820px) { main, .books { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header><strong>Library Management CMS</strong><span>Catalog, borrowing, and inventory demo</span></header>
  <main>
    <aside class="panel">
      <h1>Add Book</h1>
      <p>Create a catalog item and manage its availability.</p>
      <form id="bookForm">
        <input id="title" required placeholder="Book title">
        <input id="author" required placeholder="Author">
        <select id="category"><option>Programming</option><option>Research</option><option>General Education</option><option>Fiction</option></select>
        <button type="submit">Save Book</button>
      </form>
    </aside>
    <section class="panel">
      <h2>Catalog</h2>
      <div class="filters"><input id="search" placeholder="Search by title, author, or category"></div>
      <div class="books" id="books"></div>
    </section>
  </main>
  <script>
    const key = "library-cms-books";
    const defaults = [
      { title: "Web Development Basics", author: "D. Santos", category: "Programming", status: "Available" },
      { title: "Research Methods", author: "L. Cruz", category: "Research", status: "Borrowed" },
    ];
    const booksEl = document.getElementById("books");
    const search = document.getElementById("search");
    function readBooks() {
      return JSON.parse(localStorage.getItem(key) || JSON.stringify(defaults));
    }
    function writeBooks(items) {
      localStorage.setItem(key, JSON.stringify(items));
    }
    function render() {
      const query = search.value.toLowerCase();
      booksEl.innerHTML = "";
      readBooks().filter((book) => Object.values(book).join(" ").toLowerCase().includes(query)).forEach((book, index) => {
        const card = document.createElement("article");
        card.className = "book";
        card.innerHTML = `<span class="tag">${book.status}</span><strong>${book.title}</strong><span>${book.author}</span><small>${book.category}</small><div class="actions"><button data-toggle="${index}">${book.status === "Available" ? "Borrow" : "Return"}</button><button class="danger" data-delete="${index}">Delete</button></div>`;
        booksEl.appendChild(card);
      });
      booksEl.querySelectorAll("[data-toggle]").forEach((button) => button.addEventListener("click", () => {
        const books = readBooks();
        const book = books[Number(button.dataset.toggle)];
        book.status = book.status === "Available" ? "Borrowed" : "Available";
        writeBooks(books);
        render();
      }));
      booksEl.querySelectorAll("[data-delete]").forEach((button) => button.addEventListener("click", () => {
        const books = readBooks();
        books.splice(Number(button.dataset.delete), 1);
        writeBooks(books);
        render();
      }));
    }
    document.getElementById("bookForm").addEventListener("submit", (event) => {
      event.preventDefault();
      const books = readBooks();
      const titleInput = document.getElementById("title");
      const authorInput = document.getElementById("author");
      const categoryInput = document.getElementById("category");
      books.push({ title: titleInput.value, author: authorInput.value, category: categoryInput.value, status: "Available" });
      writeBooks(books);
      event.target.reset();
      render();
    });
    search.addEventListener("input", render);
    render();
  </script>
</body>
</html>
