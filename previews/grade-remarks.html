<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grade Remarks Generator Demo</title>
    <style>
      :root {
        color-scheme: dark;
        --accent: #64ffda;
        --text: #e8f1ff;
        --muted: #9bb0cf;
        --line: rgba(100, 255, 218, 0.18);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background:
          radial-gradient(circle at 18% 12%, rgba(100, 255, 218, 0.14), transparent 32%),
          linear-gradient(135deg, #04101f, #071a31);
        color: var(--text);
        font-family: Arial, sans-serif;
      }

      main {
        width: min(1100px, calc(100% - 32px));
        margin: 0 auto;
        padding: 32px 0;
      }

      .layout {
        display: grid;
        grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.1fr);
        gap: 18px;
      }

      .panel {
        border: 1px solid var(--line);
        border-radius: 18px;
        background: rgba(13, 33, 59, 0.88);
        box-shadow: 0 24px 70px rgba(0, 0, 0, 0.35);
        padding: 24px;
      }

      h1 {
        margin: 0 0 8px;
        font-size: clamp(1.9rem, 5vw, 3.6rem);
      }

      p {
        color: var(--muted);
        line-height: 1.7;
      }

      label {
        display: grid;
        gap: 7px;
        margin-bottom: 13px;
        color: var(--muted);
        font-weight: 700;
      }

      input {
        width: 100%;
        min-height: 44px;
        border: 1px solid rgba(100, 255, 218, 0.2);
        border-radius: 12px;
        padding: 10px 12px;
        background: rgba(0, 0, 0, 0.2);
        color: var(--text);
        font: inherit;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 18px;
      }

      button {
        min-height: 44px;
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 10px 14px;
        background: rgba(100, 255, 218, 0.1);
        color: var(--accent);
        font-weight: 800;
        cursor: pointer;
      }

      button.secondary {
        background: rgba(255, 255, 255, 0.04);
        color: var(--muted);
      }

      .result {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 12px;
        margin: 18px 0;
      }

      .metric {
        border: 1px solid rgba(100, 255, 218, 0.14);
        border-radius: 14px;
        padding: 14px;
        background: rgba(100, 255, 218, 0.06);
      }

      .metric span {
        display: block;
        color: var(--muted);
        font-size: 0.82rem;
        font-weight: 700;
      }

      .metric strong {
        display: block;
        margin-top: 4px;
        color: var(--accent);
        font-size: 1.3rem;
      }

      table {
        width: 100%;
        border-collapse: collapse;
      }

      th,
      td {
        padding: 12px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        text-align: left;
      }

      th {
        color: var(--accent);
        background: rgba(100, 255, 218, 0.08);
      }

      .pill {
        display: inline-flex;
        padding: 6px 10px;
        border-radius: 999px;
        background: rgba(100, 255, 218, 0.1);
        color: var(--accent);
        font-weight: 800;
      }

      @media (max-width: 820px) {
        main {
          padding: 18px 0;
        }

        .layout,
        .result {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="panel" style="margin-bottom: 18px">
        <h1>Grade Remarks Generator</h1>
        <p>Enter scores, generate a remark, and save the result to the table.</p>
      </section>

      <div class="layout">
        <section class="panel">
          <form id="grade-form">
            <label>
              Student Name
              <input id="student" value="Sample Learner" required />
            </label>
            <label>
              Student Behavior (0-100)
              <input id="behavior" type="number" min="0" max="100" value="88" required />
            </label>
            <label>
              Attendance %
              <input id="attendance" type="number" min="0" max="100" value="95" required />
            </label>
            <label>
              Assignment Average
              <input id="assignment" type="number" min="0" max="100" value="90" required />
            </label>
            <label>
              Quiz Score
              <input id="quiz" type="number" min="0" max="100" value="86" required />
            </label>
            <label>
              Exam Score
              <input id="exam" type="number" min="0" max="100" value="84" required />
            </label>
            <div class="actions">
              <button type="submit">Generate Remark</button>
              <button class="secondary" type="button" id="clear-btn">Clear Records</button>
            </div>
          </form>
        </section>

        <section class="panel">
          <div class="result">
            <div class="metric">
              <span>Weighted Score</span>
              <strong id="score">88.6</strong>
            </div>
            <div class="metric">
              <span>Remark</span>
              <strong id="remark">Very Good</strong>
            </div>
            <div class="metric">
              <span>Status</span>
              <strong id="status">Passing</strong>
            </div>
          </div>

          <table>
            <thead>
              <tr>
                <th>Student</th>
                <th>Score</th>
                <th>Remark</th>
              </tr>
            </thead>
            <tbody id="records"></tbody>
          </table>
        </section>
      </div>
    </main>

    <script>
      const form = document.getElementById("grade-form");
      const recordsBody = document.getElementById("records");
      const scoreEl = document.getElementById("score");
      const remarkEl = document.getElementById("remark");
      const statusEl = document.getElementById("status");
      const clearBtn = document.getElementById("clear-btn");
      const storageKey = "gradeRemarksDemoRecords";

      const getRemark = (score) => {
        if (score >= 90) return "Excellent";
        if (score >= 85) return "Very Good";
        if (score >= 80) return "Good";
        if (score >= 75) return "Average";
        if (score >= 70) return "Fair";
        return "Poor";
      };

      const loadRecords = () => JSON.parse(localStorage.getItem(storageKey) || "[]");
      const saveRecords = (records) => localStorage.setItem(storageKey, JSON.stringify(records));

      const renderRecords = () => {
        recordsBody.innerHTML = loadRecords()
          .map(
            (record) => `
              <tr>
                <td>${record.student}</td>
                <td>${record.score}</td>
                <td><span class="pill">${record.remark}</span></td>
              </tr>
            `
          )
          .join("");
      };

      form.addEventListener("submit", (event) => {
        event.preventDefault();
        const student = document.getElementById("student").value.trim();
        const behavior = Number(document.getElementById("behavior").value);
        const attendance = Number(document.getElementById("attendance").value);
        const assignment = Number(document.getElementById("assignment").value);
        const quiz = Number(document.getElementById("quiz").value);
        const exam = Number(document.getElementById("exam").value);
        const score = behavior * 0.15 + attendance * 0.15 + assignment * 0.2 + quiz * 0.2 + exam * 0.3;
        const rounded = score.toFixed(1);
        const remark = getRemark(score);

        scoreEl.textContent = rounded;
        remarkEl.textContent = remark;
        statusEl.textContent = score >= 75 ? "Passing" : "Intervention";

        const records = loadRecords();
        records.unshift({ student, score: rounded, remark });
        saveRecords(records.slice(0, 8));
        renderRecords();
      });

      clearBtn.addEventListener("click", () => {
        saveRecords([]);
        renderRecords();
      });

      if (!loadRecords().length) {
        saveRecords([{ student: "Sample Learner", score: "88.6", remark: "Very Good" }]);
      }

      renderRecords();
    </script>
  </body>
</html>
