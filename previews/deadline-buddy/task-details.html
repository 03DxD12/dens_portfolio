<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Requirement Details - Deadline Buddy</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-layout">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="brand">
                <div class="brand-icon">🎓</div>
                <div>
                    <div class="brand-title">Deadline Buddy</div>
                    <div class="brand-sub">Olinsterg College Inc.</div>
                </div>
            </div>
            
            <nav class="nav-menu">
                <a href="dashboard.html" class="nav-item">
                    <span class="nav-icon">📊</span>
                    <span>Dashboard</span>
                </a>
                <a href="tasks.html" class="nav-item active">
                    <span class="nav-icon">📝</span>
                    <span>Tasks & Requirements</span>
                </a>
                <a href="subjects.html" class="nav-item">
                    <span class="nav-icon">📚</span>
                    <span>Subjects</span>
                </a>
                <a href="calendar.html" class="nav-item">
                    <span class="nav-icon">📅</span>
                    <span>Calendar</span>
                </a>
                <a href="reminders.html" class="nav-item">
                    <span class="nav-icon">⏰</span>
                    <span>Reminders & Alerts</span>
                </a>
                <a href="profile.html" class="nav-item">
                    <span class="nav-icon">👤</span>
                    <span>Student Profile</span>
                </a>
            </nav>

            <div class="user-pill">
                <div class="avatar" id="sidebarAvatar">G12</div>
                <div style="flex:1; overflow:hidden;">
                    <div style="font-weight: 600; font-size: 0.88rem; text-overflow: ellipsis; overflow: hidden; white-space: nowrap;" id="sidebarName">Student</div>
                    <div style="font-size: 0.75rem; color: var(--text-muted);" id="sidebarTrack">Grade 12 - ASSH</div>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Topbar -->
            <header class="topbar">
                <button class="mobile-toggle" id="menuToggle">☰</button>
                <div style="flex: 1;">
                    <h1 style="font-size: 1.3rem; margin: 0;">Requirement View 🔍</h1>
                    <p style="font-size: 0.85rem; color: var(--text-muted); margin: 0;">Review details, subtasks, and countdown timer</p>
                </div>

                <a href="tasks.html" class="btn btn-secondary">
                    <span>⬅️</span> Back to Tasks
                </a>
            </header>

            <!-- Container -->
            <div class="container" style="max-width: 860px;" id="taskDetailContainer">
                <!-- Dynamically populated -->
            </div>
        </main>
    </div>

    <!-- Bottom Mobile Nav -->
    <div class="mobile-nav">
        <a href="dashboard.html" class="mobile-nav-item">
            <span class="icon">📊</span>
            <span>Home</span>
        </a>
        <a href="tasks.html" class="mobile-nav-item active">
            <span class="icon">📝</span>
            <span>Tasks</span>
        </a>
        <a href="subjects.html" class="mobile-nav-item">
            <span class="icon">📚</span>
            <span>Subjects</span>
        </a>
        <a href="calendar.html" class="mobile-nav-item">
            <span class="icon">📅</span>
            <span>Calendar</span>
        </a>
        <a href="reminders.html" class="mobile-nav-item">
            <span class="icon">⏰</span>
            <span>Alerts</span>
        </a>
    </div>

    <script src="js/storage.js"></script>
    <script src="js/deadline.js"></script>
    <script src="js/notifications.js"></script>
    <script src="js/app.js"></script>
    <script>
        let currentTask = null;

        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const taskId = urlParams.get('id');

            if (!taskId) {
                window.location.href = 'tasks.html';
                return;
            }

            renderTaskDetails(taskId);
        });

        function renderTaskDetails(taskId) {
            currentTask = Storage.getTasks().find(t => t.id === taskId);
            const container = document.getElementById('taskDetailContainer');

            if (!currentTask) {
                container.innerHTML = `
                    <div class="card" style="text-align: center; padding: 40px;">
                        <h3>Requirement Not Found</h3>
                        <p style="color: var(--text-muted); margin-bottom: 20px;">The requested task might have been removed.</p>
                        <a href="tasks.html" class="btn btn-primary">Return to Tasks</a>
                    </div>
                `;
                return;
            }

            const subjects = Storage.getSubjects();
            const subject = subjects.find(s => s.id === currentTask.subjectId);
            const urgency = Deadline.getUrgencyState(currentTask.dueDate);
            const subtasks = currentTask.subtasks || [];
            const doneCount = subtasks.filter(s => s.completed).length;
            const progressPercent = subtasks.length > 0 ? Math.round((doneCount / subtasks.length) * 100) : 0;

            container.innerHTML = `
                <!-- Main Header Card -->
                <div class="card" style="margin-bottom: 20px;">
                    <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 12px; flex-wrap: wrap;">
                        <div>
                            <span class="badge badge-normal" style="margin-bottom: 8px;">🏷️ ${currentTask.type}</span>
                            <h2 style="margin: 4px 0 8px 0; font-size: 1.5rem; color: var(--text-heading);">${currentTask.title}</h2>
                            <div style="font-size: 0.95rem; color: var(--text-muted);">
                                📚 Subject: <strong style="color: var(--text-main);">${subject ? subject.name : 'Unspecified'}</strong> 
                                ${subject && subject.teacher ? ` &bull; 👨‍🏫 Adviser: ${subject.teacher}` : ''}
                            </div>
                        </div>
                        <span class="badge ${urgency.badgeClass}" style="font-size: 0.9rem; padding: 8px 16px;" data-due-date="${currentTask.dueDate}">
                            ${currentTask.status === 'Completed' ? '✅ Completed' : urgency.label}
                        </span>
                    </div>

                    <!-- Live Deadline Banner -->
                    <div class="alert ${urgency.badgeClass.includes('overdue') ? 'alert-danger' : urgency.badgeClass.includes('urgent') || urgency.badgeClass.includes('today') ? 'alert-warning' : 'alert-info'}" style="display: flex; align-items: center; justify-content: space-between; font-size: 0.95rem;">
                        <div>
                            <strong>⏰ Exact Due Date:</strong> ${Deadline.formatDeadline(currentTask.dueDate)}
                        </div>
                        <div style="font-weight: 700;" data-due-date="${currentTask.dueDate}">
                            ${currentTask.status === 'Completed' ? 'Task Completed' : urgency.label}
                        </div>
                    </div>

                    <!-- Metadata row -->
                    <div class="grid grid-3" style="margin-top: 16px; border-top: 1px solid var(--border-color); padding-top: 16px; font-size: 0.88rem;">
                        <div>
                            <span style="color: var(--text-muted);">Priority Level:</span><br>
                            <strong style="color: ${currentTask.priority === 'High' ? 'var(--danger)' : currentTask.priority === 'Medium' ? 'var(--warning)' : 'var(--success)'};">
                                ${currentTask.priority === 'High' ? '🔴 High' : currentTask.priority === 'Medium' ? '🟡 Medium' : '🟢 Low'}
                            </strong>
                        </div>
                        <div>
                            <span style="color: var(--text-muted);">Status:</span><br>
                            <strong style="color: ${currentTask.status === 'Completed' ? 'var(--success)' : 'var(--warning)'};">${currentTask.status}</strong>
                        </div>
                        <div>
                            <span style="color: var(--text-muted);">Created On:</span><br>
                            <strong>${new Date(currentTask.createdAt).toLocaleDateString()}</strong>
                        </div>
                    </div>
                </div>

                <!-- Instructions & Notes Card -->
                <div class="card" style="margin-bottom: 20px;">
                    <h3 style="font-size: 1.1rem; margin-top: 0; margin-bottom: 12px; border-bottom: 1px solid var(--border-color); padding-bottom: 8px;">
                        📌 Requirement Notes & Instructions
                    </h3>
                    <div style="font-size: 0.92rem; line-height: 1.6; color: var(--text-main); white-space: pre-line;">
                        ${currentTask.description ? currentTask.description : '<em style="color: var(--text-muted);">No additional notes or instructions provided.</em>'}
                    </div>
                </div>

                <!-- Subtasks Checklist Card -->
                <div class="card" style="margin-bottom: 20px;">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; border-bottom: 1px solid var(--border-color); padding-bottom: 8px;">
                        <h3 style="font-size: 1.1rem; margin: 0;">📋 Step-by-Step Subtasks Checklist</h3>
                        <span style="font-size: 0.85rem; color: var(--text-muted);">
                            <strong>${doneCount}</strong> of <strong>${subtasks.length}</strong> completed (${progressPercent}%)
                        </span>
                    </div>

                    ${subtasks.length === 0 ? `
                        <div style="text-align: center; color: var(--text-muted); padding: 16px; font-size: 0.9rem;">
                            No subtasks set for this requirement. <a href="task-form.html?id=${currentTask.id}">Edit to add subtasks</a>.
                        </div>
                    ` : `
                        <div style="display: flex; flex-direction: column; gap: 10px;">
                            ${subtasks.map((s, idx) => `
                                <label style="display: flex; align-items: center; gap: 12px; padding: 10px; background: rgba(0,0,0,0.02); border-radius: 6px; cursor: pointer; font-size: 0.92rem;">
                                    <input type="checkbox" ${s.completed ? 'checked' : ''} onchange="toggleSubtask('${s.id}')" style="width: 18px; height: 18px;">
                                    <span style="${s.completed ? 'text-decoration: line-through; color: var(--text-muted);' : 'color: var(--text-main);'} font-weight: 500;">
                                        ${s.title}
                                    </span>
                                </label>
                            `).join('')}
                        </div>
                    `}
                </div>

                <!-- Actions Card -->
                <div class="card" style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px;">
                    <button onclick="toggleMainStatus()" class="btn ${currentTask.status === 'Completed' ? 'btn-secondary' : 'btn-success'}" style="padding: 10px 20px;">
                        ${currentTask.status === 'Completed' ? '🔄 Mark as Pending' : '✅ Mark Entire Requirement Completed'}
                    </button>

                    <div style="display: flex; gap: 8px;">
                        <a href="task-form.html?id=${currentTask.id}" class="btn btn-secondary">✏️ Edit Requirement</a>
                        <button onclick="deleteCurrentTask()" class="btn btn-danger">🗑️ Delete</button>
                    </div>
                </div>
            `;
        }

        window.toggleSubtask = (subtaskId) => {
            if (!currentTask || !currentTask.subtasks) return;
            const sub = currentTask.subtasks.find(s => s.id === subtaskId);
            if (sub) {
                sub.completed = !sub.completed;
                
                // Auto check if all subtasks complete
                const allDone = currentTask.subtasks.every(s => s.completed);
                if (allDone) {
                    currentTask.status = 'Completed';
                } else if (currentTask.status === 'Completed' && !allDone) {
                    currentTask.status = 'In Progress';
                }

                Storage.updateTask(currentTask.id, { 
                    subtasks: currentTask.subtasks,
                    status: currentTask.status
                });
                renderTaskDetails(currentTask.id);
            }
        };

        window.toggleMainStatus = () => {
            if (!currentTask) return;
            const newStatus = currentTask.status === 'Completed' ? 'Pending' : 'Completed';
            Storage.updateTask(currentTask.id, { status: newStatus });
            renderTaskDetails(currentTask.id);
        };

        window.deleteCurrentTask = () => {
            if (confirm('Are you sure you want to delete this requirement?')) {
                Storage.deleteTask(currentTask.id);
                window.location.href = 'tasks.html';
            }
        };
    </script>
</body>
</html>
