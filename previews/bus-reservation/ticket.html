<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ticket | Voyage</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="ticket-page">
      <section class="ticket-card" id="ticket-card">
        <h1>Voyage Ticket</h1>
        <p class="muted">Enter your reference and contact on the home page to view full ticket details.</p>
        <strong id="ticket-ref"></strong>
      </section>
    </main>
    <script>
      document.getElementById("ticket-ref").textContent =
        new URLSearchParams(location.search).get("ref") || "No reference";
    </script>
  </body>
</html>
